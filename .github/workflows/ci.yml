# CI — Faza 8, T8 (decyzja D5 = tak).
# verify:     lint + typy (front i backend) + testy (front i backend) + build.
# Bez sekretów repo: wszystkie wartości env są jawnymi, testowymi atrapami.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Jawne `bash` = `bash --noprofile --norc -eo pipefail`, czyli błąd w potoku przerywa krok.
    shell: bash

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 24 (Active LTS), a NIE `.nvmrc` (v25, wydanie nie-LTS używane lokalnie).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (frontend)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck (backend)
        run: npx tsc --noEmit -p src_backend/tsconfig.json

      - name: Test (frontend)
        run: npm run test:front

      - name: Test (backend)
        run: npm run test:back

      - name: Build
        run: npm run build
