# render.yaml: API Mars Terraform na Render (Blueprint). Faza 8, D15 (zastępuje Fly.io z D1/D8).
#
# Obraz: `Dockerfile.api` (sam backend, serve_frontend=false). Frontend jest na Vercel.
# Bez bazy i bez dysku: kontener jest bezstanowy.
# T15/D18: serwer bez bazy, kont i sekretów; gra działa w przeglądarce. Usługę można wstrzymać do fazy gry sieciowej.
#
# Wdrożenie (wykonuje człowiek, agent niczego nie wdraża): dashboard.render.com → New → Blueprint →
# repo `develforever/mars-terraform`, gałąź `main`. Render czyta ten plik i pyta o wartości `sync: false`.
# Runbook: `.docs/faza-8/DEPLOYMENT.md`, sekcja 3.
#
# Zmienne dodawane w panelu → Environment (opcjonalnie): cors_origins (domena frontendu).

services:
  - type: web
    name: mars-terraform-api
    runtime: docker
    # Darmowy plan: usypia po 15 min bez ruchu, start ok. 1 min; 750 h/miesiąc na workspace.
    plan: free
    region: frankfurt
    branch: main
    # Deploy dopiero po zielonym CI na `main` (verify + docker-api).
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: serve_frontend
        value: "false"
      # Render kieruje ruch na PORT; ustawiamy jawnie zgodnie z EXPOSE w `Dockerfile.api`.
      - key: PORT
        value: "8080"
      # `cors_origins` celowo NIE jest tu zadeklarowany: dodaje się go w panelu PO poznaniu domeny Vercel
      # (sekcja 5). Brak `cors_origins` = CORS wyłączony, co jest zamierzone do czasu ustawienia.
